<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>The Brain</title>
<link rel="icon" href="/favicon-32.png">
<style>
  :root{--bg:#070707;--gold:#d4af37;--gold2:#f1d78a;--dim:#8a7f63;--line:#2a2620;--panel:#121010;--text:#f3efe6;--muted:#9a927f}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow:hidden}
  #sky{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:radial-gradient(1200px 800px at 50% 42%,#15120b 0%,#0a0907 55%,#060605 100%)}
  #sky.grabbing{cursor:grabbing}
  .label{font:600 12px/1 Arial,sans-serif;fill:var(--text);paint-order:stroke;stroke:#000;stroke-width:3px;stroke-linejoin:round;pointer-events:none;user-select:none}
  .glyph{font-size:20px;pointer-events:none;user-select:none;dominant-baseline:central;text-anchor:middle}
  .ndot{cursor:pointer}
  /* top bar */
  #bar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:12px 14px;z-index:5;
    background:linear-gradient(180deg,rgba(7,7,7,.92),rgba(7,7,7,0));pointer-events:none}
  #bar .pointerize{pointer-events:auto}
  .brandrow{display:flex;align-items:center;gap:9px}
  .brandrow img{width:26px;height:26px}
  .brandrow b{font:700 15px/1 Georgia,serif;letter-spacing:.3px;color:var(--gold2)}
  .brandrow span{font:600 10px/1 Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
  .sp{flex:1}
  .btn{pointer-events:auto;background:linear-gradient(180deg,#1a1710,#120f0a);border:1px solid var(--line);color:var(--text);
    font:600 13px/1 Arial,sans-serif;padding:10px 14px;border-radius:11px;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--gold)}
  .btn.gold{background:linear-gradient(180deg,#f1d78a,#d4af37);color:#1a1400;border:0;font-weight:700}
  .btn.on{border-color:var(--gold2);color:var(--gold2);box-shadow:0 0 0 1px var(--gold2) inset}
  .hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;color:#5f5a4d;font:500 12px/1.4 Arial,sans-serif;pointer-events:none;z-index:4}
  /* legend */
  #legend{position:fixed;left:14px;bottom:14px;z-index:5;display:flex;flex-direction:column;gap:6px;pointer-events:none}
  .lg{display:flex;align-items:center;gap:7px;font:600 11px/1 Arial,sans-serif;color:var(--muted)}
  .lg i{width:11px;height:11px;border-radius:50%;display:inline-block}
  /* panel */
  #panel{position:fixed;top:0;right:0;height:100%;width:380px;max-width:92vw;background:var(--panel);border-left:1px solid var(--line);
    transform:translateX(100%);transition:transform .22s cubic-bezier(.3,.7,.3,1);z-index:10;display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(0,0,0,.5)}
  #panel.open{transform:none}
  .ph{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .ph .pg{font-size:26px}
  .ph .pt{flex:1;min-width:0}
  .ph .pt b{display:block;font:700 18px/1.2 Georgia,serif;color:var(--text);overflow:hidden;text-overflow:ellipsis}
  .ph .pt small{color:var(--dim);font:600 10px/1 Arial,sans-serif;letter-spacing:1.5px;text-transform:uppercase}
  .x{cursor:pointer;color:var(--muted);font-size:22px;line-height:1;padding:4px 8px;border-radius:8px}
  .x:hover{background:#1e1b14;color:var(--text)}
  .pb{padding:16px 18px;overflow:auto;flex:1}
  label{display:block;font:600 11px/1 Arial,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin:14px 0 6px}
  input,select,textarea{width:100%;background:#0c0b09;border:1px solid var(--line);border-radius:10px;color:var(--text);
    font:400 14px/1.4 Arial,sans-serif;padding:11px 12px;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--gold)}
  textarea{resize:vertical;min-height:70px}
  .row2{display:flex;gap:10px}.row2>*{flex:1}
  .pf{display:flex;gap:8px;padding:14px 18px;border-top:1px solid var(--line)}
  .pf .btn{flex:1;text-align:center;justify-content:center}
  .danger{color:#e6a3a3;border-color:#5e2c2c!important}
  .danger:hover{border-color:#e6a3a3!important}
  .view-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:#17140d;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font:600 12px/1 Arial,sans-serif;color:var(--muted);cursor:pointer}
  .chip:hover{border-color:var(--gold)}
  a.linkout{color:var(--gold2);word-break:break-all;font:500 13px/1.5 Arial,sans-serif}
  .desc{color:#cfc9ba;font:400 14px/1.6 Georgia,serif;white-space:pre-wrap}
  .status-live{color:#6fd18a}.status-building{color:var(--gold2)}.status-idea{color:var(--muted)}.status-paused{color:#b98d8d}
  .toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:#1a1710;border:1px solid var(--gold);color:var(--gold2);
    font:600 13px/1 Arial,sans-serif;padding:11px 16px;border-radius:12px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:30px;z-index:20;background:var(--bg)}
  .gate b{font:700 22px/1.3 Georgia,serif;color:var(--gold2)}.gate p{color:var(--muted);max-width:320px}
</style>
</head>
<body>
<svg id="sky">
  <defs>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="core-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4cf"/><stop offset="45%" stop-color="#f1d78a"/><stop offset="100%" stop-color="#9c7d2e"/>
    </radialGradient>
  </defs>
  <g id="world">
    <g id="links"></g>
    <g id="pulses"></g>
    <g id="nodes"></g>
  </g>
</svg>

<div id="bar">
  <div class="brandrow pointerize"><img src="/logo.svg" alt=""><div><b>The Brain</b><br><span>Meridian command center</span></div></div>
  <div class="sp"></div>
  <a class="btn pointerize" href="/dev" style="text-decoration:none" title="Back to the developer console">Console</a>
  <button class="btn pointerize" id="connectBtn" title="Wire two nodes together">🔗 Connect</button>
  <button class="btn gold pointerize" id="addBtn">＋ Add</button>
</div>

<div id="legend">
  <div class="lg"><i style="background:#f1d78a"></i> Core</div>
  <div class="lg"><i style="background:#d4af37"></i> App</div>
  <div class="lg"><i style="background:#e8dcc0"></i> Knowledge</div>
  <div class="lg"><i style="background:#c99a5b"></i> Design</div>
  <div class="lg"><i style="background:#6e665200;border:1px dashed #8a7f63"></i> Idea</div>
  <div class="lg"><i style="background:#7bbf92"></i> Compliance</div>
</div>

<div class="hint" id="hint">Drag the background to move · scroll to zoom · tap a node to open it</div>

<div id="panel"><div id="panelInner"></div></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const SVG="http://www.w3.org/2000/svg";
const TYPES={core:{g:"🧠",c:"#f1d78a",r:34},app:{g:"📇",c:"#d4af37",r:24},knowledge:{g:"📚",c:"#e8dcc0",r:23},design:{g:"🎨",c:"#c99a5b",r:23},idea:{g:"💡",c:"#8a7f63",r:21},compliance:{g:"🛡️",c:"#7bbf92",r:23}};
const TYPE_LABELS={core:"Core",app:"App",knowledge:"Knowledge",design:"Design",idea:"Idea",compliance:"Compliance"};
const STATUS_LABELS={live:"Live",building:"Building",idea:"Idea",paused:"Paused"};
let N=[],L=[],byId={};
let view={s:1,tx:0,ty:0};
let selected=null, connectMode=false, connectFirst=null;
const sky=$("#sky"), world=$("#world"), gLinks=$("#links"), gNodes=$("#nodes"), gPulses=$("#pulses");

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1800);}
async function api(path,opts){return fetch(path,Object.assign({headers:{"content-type":"application/json"}},opts));}

async function boot(){
  let r;
  try{ r=await api("/api/dev/brain"); }catch(e){ return gate("Can't reach the server."); }
  if(r.status===401) return gate();
  const data=await r.json();
  N=data.nodes||[]; L=data.links||[];
  N.forEach(n=>{ n.vx=0;n.vy=0; if(!n.x&&!n.y){n.x=(Math.random()-.5)*200;n.y=(Math.random()-.5)*200;} });
  index(); build(); requestAnimationFrame(tick);
}
function gate(msg){
  document.body.insertAdjacentHTML("beforeend",
    `<div class="gate"><img src="/logo.svg" width="54" style="opacity:.9"><b>${msg?msg:"This is your brain"}</b>
     <p>${msg?"":"Sign in as the developer to open it."}</p><a class="btn gold pointerize" href="/" style="text-decoration:none">Go to sign in</a></div>`);
}
function index(){ byId={}; N.forEach(n=>byId[n.id]=n); }

/* ---------- build DOM (once per data change) ---------- */
function build(){
  gLinks.innerHTML=""; gNodes.innerHTML=""; gPulses.innerHTML="";
  L.forEach((l,i)=>{
    const p=document.createElementNS(SVG,"path");
    p.setAttribute("fill","none");
    p.setAttribute("stroke","#5a4e2e"); p.setAttribute("stroke-width","1.4"); p.setAttribute("stroke-opacity",".55");
    p.dataset.i=i; gLinks.appendChild(p); l._el=p;
    const pulse=document.createElementNS(SVG,"circle");
    pulse.setAttribute("r","2.3"); pulse.setAttribute("fill","#f1d78a"); pulse.setAttribute("opacity",".9");
    gPulses.appendChild(pulse); l._pulse=pulse; l._t=Math.random();
  });
  N.forEach(n=>{
    const t=TYPES[n.type]||TYPES.idea;
    const g=document.createElementNS(SVG,"g"); g.setAttribute("class","ndot"); g.dataset.id=n.id;
    const halo=document.createElementNS(SVG,"circle");
    halo.setAttribute("r",t.r+(n.type==="core"?10:6)); halo.setAttribute("fill",t.c); halo.setAttribute("opacity",n.status==="idea"?".04":".10"); halo.setAttribute("filter","url(#glow)");
    const ring=document.createElementNS(SVG,"circle");
    ring.setAttribute("r",t.r); ring.setAttribute("fill",n.type==="core"?"url(#core-g)":"#15120b");
    ring.setAttribute("stroke",t.c); ring.setAttribute("stroke-width",n.type==="core"?0:2);
    if(n.status==="idea"){ring.setAttribute("stroke-dasharray","4 4");ring.setAttribute("stroke-opacity",".7");}
    if(n.status==="paused"){ring.setAttribute("stroke","#6a6458");}
    const glyph=document.createElementNS(SVG,"text"); glyph.setAttribute("class","glyph"); glyph.setAttribute("y","1"); glyph.textContent=t.g;
    const label=document.createElementNS(SVG,"text"); label.setAttribute("class","label"); label.setAttribute("text-anchor","middle");
    label.setAttribute("y",t.r+16); label.textContent=n.title;
    g.append(halo,ring,glyph,label);
    gNodes.appendChild(g); n._el=g; n._ring=ring; n._halo=halo;
    g.addEventListener("pointerdown",e=>onNodeDown(e,n));
  });
}

/* ---------- physics ---------- */
function tick(){
  const REP=14000, SPR=.012, LEN=150, CEN=.004, DAMP=.86;
  for(let i=0;i<N.length;i++){
    const a=N[i]; if(a.type==="core"){a.x=0;a.y=0;a.vx=a.vy=0;continue;}
    for(let j=i+1;j<N.length;j++){
      const b=N[j]; let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy||.01,d=Math.sqrt(d2);
      const f=REP/d2; const fx=dx/d*f, fy=dy/d*f;
      a.vx+=fx;a.vy+=fy; if(b.type!=="core"){b.vx-=fx;b.vy-=fy;}
    }
    a.vx-=a.x*CEN; a.vy-=a.y*CEN;
  }
  L.forEach(l=>{
    const a=byId[l.a],b=byId[l.b]; if(!a||!b)return;
    let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01,f=(d-LEN)*SPR;
    const fx=dx/d*f, fy=dy/d*f;
    if(a.type!=="core"){a.vx+=fx;a.vy+=fy;} if(b.type!=="core"){b.vx-=fx;b.vy-=fy;}
  });
  N.forEach(n=>{ if(n===dragging||n.type==="core")return; n.vx*=DAMP;n.vy*=DAMP;
    n.vx=Math.max(-6,Math.min(6,n.vx));n.vy=Math.max(-6,Math.min(6,n.vy)); n.x+=n.vx;n.y+=n.vy; });
  // paint
  world.setAttribute("transform",`translate(${innerWidth/2+view.tx},${innerHeight/2+view.ty}) scale(${view.s})`);
  N.forEach(n=>n._el.setAttribute("transform",`translate(${n.x},${n.y})`));
  L.forEach(l=>{ const a=byId[l.a],b=byId[l.b]; if(!a||!b)return;
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2, dx=b.x-a.x,dy=b.y-a.y, nx=-dy,ny=dx, k=.12;
    const cx=mx+nx*k, cy=my+ny*k;
    l._el.setAttribute("d",`M${a.x},${a.y} Q${cx},${cy} ${b.x},${b.y}`);
    l._t=(l._t+.004)%1; const tt=l._t, u=1-tt;
    const px=u*u*a.x+2*u*tt*cx+tt*tt*b.x, py=u*u*a.y+2*u*tt*cy+tt*tt*b.y;
    l._pulse.setAttribute("cx",px); l._pulse.setAttribute("cy",py);
  });
  requestAnimationFrame(tick);
}

/* ---------- pan / zoom ---------- */
let panning=false,panStart=null;
sky.addEventListener("pointerdown",e=>{ if(e.target.closest(".ndot"))return; panning=true;panStart={x:e.clientX-view.tx,y:e.clientY-view.ty};sky.classList.add("grabbing");
  if(connectMode){ setConnect(false); } });
addEventListener("pointermove",e=>{ if(panning){view.tx=e.clientX-panStart.x;view.ty=e.clientY-panStart.y;} if(dragging)onDragMove(e); });
addEventListener("pointerup",()=>{ panning=false;sky.classList.remove("grabbing"); if(dragging)onDragUp(); });
sky.addEventListener("wheel",e=>{ e.preventDefault(); const f=e.deltaY<0?1.1:1/1.1; view.s=Math.max(.3,Math.min(2.6,view.s*f)); },{passive:false});

/* ---------- node drag / click ---------- */
let dragging=null,dragMoved=false,dragStart=null,layoutTimer=null;
function toWorld(cx,cy){ return {x:(cx-innerWidth/2-view.tx)/view.s, y:(cy-innerHeight/2-view.ty)/view.s}; }
function onNodeDown(e,n){ e.stopPropagation(); if(n.type==="core"&&!connectMode){ openNode(n); return; }
  if(connectMode){ pickConnect(n); return; }
  dragging=n; dragMoved=false; dragStart={x:e.clientX,y:e.clientY}; n._el.setPointerCapture?.(e.pointerId); }
function onDragMove(e){ if(!dragging)return; const w=toWorld(e.clientX,e.clientY); dragging.x=w.x;dragging.y=w.y;dragging.vx=dragging.vy=0;
  if(Math.hypot(e.clientX-dragStart.x,e.clientY-dragStart.y)>4)dragMoved=true; }
function onDragUp(){ const n=dragging; dragging=null; if(!dragMoved){ openNode(n); return; } n.pinned=true; saveLayout(); }
function saveLayout(){ clearTimeout(layoutTimer); layoutTimer=setTimeout(()=>{
  api("/api/dev/brain/layout",{method:"POST",body:JSON.stringify({positions:N.map(n=>({id:n.id,x:Math.round(n.x),y:Math.round(n.y),pinned:!!n.pinned}))})});
},600); }

/* ---------- connect mode ---------- */
$("#connectBtn").onclick=()=>setConnect(!connectMode);
function setConnect(on){ connectMode=on; connectFirst=null; $("#connectBtn").classList.toggle("on",on);
  $("#hint").textContent=on?"Connect mode: tap one node, then another to wire them. Tap the background to stop.":"Drag the background to move · scroll to zoom · tap a node to open it"; }
function pickConnect(n){ if(!connectFirst){ connectFirst=n; n._ring.setAttribute("stroke","#f1d78a"); toast("Now tap the node to connect to "+n.title); return; }
  if(connectFirst.id===n.id){ return; }
  api("/api/dev/brain/link",{method:"POST",body:JSON.stringify({a:connectFirst.id,b:n.id})}).then(()=>{
    L.push({a:connectFirst.id,b:n.id}); build(); toast("Wired."); setConnect(false);
  }); }

/* ---------- panel ---------- */
function openNode(n){ selected=n; const t=TYPES[n.type]||TYPES.idea;
  $("#panelInner").innerHTML=`
    <div class="ph"><span class="pg">${t.g}</span><div class="pt"><b>${esc(n.title)}</b><small>${TYPE_LABELS[n.type]||"Node"} · <span class="status-${n.status}">${STATUS_LABELS[n.status]||n.status}</span></small></div><span class="x" id="pClose">✕</span></div>
    <div class="pb">
      ${n.desc?`<div class="desc">${esc(n.desc)}</div>`:'<div class="desc" style="color:#6f6a5c">No description yet.</div>'}
      ${n.url?`<label>Link</label><a class="linkout" href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.url)} ↗</a>`:""}
      ${n.notes?`<label>Notes</label><div class="desc" style="font-size:13px">${esc(n.notes)}</div>`:""}
      <div class="view-actions">
        <span class="chip" id="pEdit">✏️ Edit</span>
        <span class="chip" id="pConnect">🔗 Connect</span>
        ${n.type!=="core"?'<span class="chip" id="pDelete">🗑 Remove</span>':""}
      </div>
    </div>`;
  $("#panel").classList.add("open");
  $("#pClose").onclick=closePanel;
  $("#pEdit").onclick=()=>editNode(n);
  $("#pConnect").onclick=()=>{ closePanel(); setConnect(true); pickConnect(n); };
  const del=$("#pDelete"); if(del)del.onclick=()=>removeNode(n);
}
function closePanel(){ $("#panel").classList.remove("open"); selected=null; }
function editNode(n){ formPanel(n); }
$("#addBtn").onclick=()=>formPanel(null);

function formPanel(n){ const isNew=!n;
  $("#panelInner").innerHTML=`
    <div class="ph"><span class="pg">${isNew?"✨":"✏️"}</span><div class="pt"><b>${isNew?"Add to the brain":"Edit"}</b><small>${isNew?"a product, design, idea or app":"update this node"}</small></div><span class="x" id="pClose">✕</span></div>
    <div class="pb">
      <label>Title</label><input id="fTitle" maxlength="80" value="${n?esc(n.title):""}" placeholder="e.g. Quoting Engine">
      <div class="row2">
        <div><label>Type</label><select id="fType">${Object.keys(TYPE_LABELS).filter(k=>k!=="core"||!isNew).map(k=>`<option value="${k}" ${n&&n.type===k?"selected":""}>${TYPE_LABELS[k]}</option>`).join("")}</select></div>
        <div><label>Status</label><select id="fStatus">${Object.keys(STATUS_LABELS).map(k=>`<option value="${k}" ${n&&n.status===k?"selected":(!n&&k==="idea"?"selected":"")}>${STATUS_LABELS[k]}</option>`).join("")}</select></div>
      </div>
      <label>What is it</label><textarea id="fDesc" maxlength="2000" placeholder="One or two lines on what this is and why it matters.">${n?esc(n.desc||""):""}</textarea>
      <label>Link (optional)</label><input id="fUrl" maxlength="400" value="${n?esc(n.url||""):""}" placeholder="https://...">
      <label>Notes (optional)</label><textarea id="fNotes" maxlength="4000" placeholder="Anything you want to remember.">${n?esc(n.notes||""):""}</textarea>
      ${isNew?'<label>Connect to</label><select id="fLink"><option value="core">Meridian (core)</option>'+N.filter(x=>x.type!=="idea"||true).map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join("")+'</select>':""}
    </div>
    <div class="pf">
      <button class="btn" id="pCancel">Cancel</button>
      <button class="btn gold" id="pSave">${isNew?"Add it":"Save"}</button>
    </div>`;
  $("#panel").classList.add("open");
  $("#pClose").onclick=closePanel; $("#pCancel").onclick=()=>n?openNode(n):closePanel();
  $("#pSave").onclick=async()=>{
    const payload={ id:n?n.id:undefined, title:$("#fTitle").value.trim()||"Untitled", type:$("#fType").value, status:$("#fStatus").value,
      desc:$("#fDesc").value.trim(), url:$("#fUrl").value.trim(), notes:$("#fNotes").value.trim() };
    if(isNew){ payload.linkTo=$("#fLink").value; const c=toWorld(innerWidth/2,innerHeight/2); payload.x=c.x+(Math.random()-.5)*60; payload.y=c.y+(Math.random()-.5)*60; }
    const r=await(await api("/api/dev/brain/node",{method:"POST",body:JSON.stringify(payload)})).json();
    if(!r.ok){ toast(r.error||"Could not save"); return; }
    if(isNew){ const node=r.node; node.vx=0;node.vy=0; N.push(node); if(payload.linkTo&&byId[payload.linkTo])L.push({a:payload.linkTo,b:node.id}); index(); build(); openNode(node); toast("Added to the brain."); }
    else { Object.assign(n,r.node); index(); build(); openNode(n); toast("Saved."); }
  };
}
async function removeNode(n){ if(!confirm("Remove “"+n.title+"” from the brain?"))return;
  const r=await(await api("/api/dev/brain/node/delete",{method:"POST",body:JSON.stringify({id:n.id})})).json();
  if(!r.ok){ toast(r.error||"Could not remove"); return; }
  N=N.filter(x=>x.id!==n.id); L=L.filter(l=>l.a!==n.id&&l.b!==n.id); index(); build(); closePanel(); toast("Removed.");
}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
addEventListener("resize",()=>{});
boot();
</script>
</body>
</html>
