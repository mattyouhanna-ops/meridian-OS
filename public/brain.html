<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>The Brain</title>
<link rel="icon" href="/favicon-32.png">
<style>
  :root{--bg:#07040d;--text:#eef0f7;--muted:#9aa0b5;--line:#241f33;--panel:#0d0a16;--accent:#7cf5ff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow:hidden}
  #sky{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;
    background:radial-gradient(1400px 900px at 50% 46%,#140a26 0%,#0a0618 55%,#05030c 100%)}
  #sky.grabbing{cursor:grabbing}
  .label{font:600 12px/1 Arial,sans-serif;fill:#eef0f7;paint-order:stroke;stroke:#000;stroke-width:3.2px;stroke-linejoin:round;pointer-events:none;user-select:none}
  .rlabel{font:800 14px/1 Arial,sans-serif;letter-spacing:3px;pointer-events:none;user-select:none;opacity:.92}
  .glyph{font-size:19px;pointer-events:none;user-select:none;dominant-baseline:central;text-anchor:middle}
  .ndot{cursor:pointer}
  #bar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:12px 14px;z-index:5;
    background:linear-gradient(180deg,rgba(7,4,13,.92),rgba(7,4,13,0));pointer-events:none}
  .brandrow{display:flex;align-items:center;gap:9px;pointer-events:auto}
  .brandrow b{font:700 16px/1 Georgia,serif;letter-spacing:.3px;color:#fff}
  .brandrow span{font:700 10px/1 Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;color:#7cf5ff;opacity:.85}
  .dotmk{width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#7cf5ff 55%,#3a7bff);box-shadow:0 0 12px #7cf5ff}
  .sp{flex:1}
  .btn{pointer-events:auto;background:#140f22;border:1px solid var(--line);color:var(--text);
    font:600 13px/1 Arial,sans-serif;padding:10px 14px;border-radius:11px;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--accent)}
  .btn.neon{background:linear-gradient(180deg,#19e7ff,#2b8cff);color:#04121a;border:0;font-weight:800;box-shadow:0 0 18px rgba(44,160,255,.5)}
  .btn.on{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;color:#6a6786;font:500 12px/1.4 Arial,sans-serif;pointer-events:none;z-index:4}
  #legend{position:fixed;left:14px;bottom:14px;z-index:5;display:flex;flex-direction:column;gap:6px;pointer-events:none}
  .lg{display:flex;align-items:center;gap:7px;font:700 11px/1 Arial,sans-serif;color:var(--muted);letter-spacing:.5px}
  .lg i{width:11px;height:11px;border-radius:50%;display:inline-block;box-shadow:0 0 8px currentColor}
  #panel{position:fixed;top:0;right:0;height:100%;width:384px;max-width:92vw;background:var(--panel);border-left:1px solid var(--line);
    transform:translateX(100%);transition:transform .22s cubic-bezier(.3,.7,.3,1);z-index:10;display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.6)}
  #panel.open{transform:none}
  .ph{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .ph .pg{font-size:26px}
  .ph .pt{flex:1;min-width:0}.ph .pt b{display:block;font:700 18px/1.2 Georgia,serif;overflow:hidden;text-overflow:ellipsis}
  .ph .pt small{font:700 10px/1 Arial,sans-serif;letter-spacing:1.5px;text-transform:uppercase}
  .x{cursor:pointer;color:var(--muted);font-size:22px;line-height:1;padding:4px 8px;border-radius:8px}.x:hover{background:#1b1630;color:#fff}
  .pb{padding:16px 18px;overflow:auto;flex:1}
  label{display:block;font:700 11px/1 Arial,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
  input,select,textarea{width:100%;background:#0a0714;border:1px solid var(--line);border-radius:10px;color:var(--text);font:400 14px/1.4 Arial,sans-serif;padding:11px 12px;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  textarea{resize:vertical;min-height:70px}
  .row2{display:flex;gap:10px}.row2>*{flex:1}
  .pf{display:flex;gap:8px;padding:14px 18px;border-top:1px solid var(--line)}.pf .btn{flex:1;text-align:center;justify-content:center}
  .view-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:#140f22;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font:600 12px/1 Arial,sans-serif;color:var(--muted);cursor:pointer}
  .chip:hover{border-color:var(--accent)}
  a.linkout{color:var(--accent);word-break:break-all;font:500 13px/1.5 Arial,sans-serif}
  .desc{color:#cdd0e0;font:400 14px/1.6 Georgia,serif;white-space:pre-wrap}
  .status-live{color:#58e39a}.status-building{color:#ffd166}.status-idea{color:var(--muted)}.status-paused{color:#b98db9}
  .toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:#140f22;border:1px solid var(--accent);color:var(--accent);font:600 13px/1 Arial,sans-serif;padding:11px 16px;border-radius:12px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:30px;z-index:40;background:radial-gradient(1000px 700px at 50% 45%,#140a26,#07040d)}
  .gate .dotmk{width:40px;height:40px;margin-bottom:4px}
  .gate b{font:700 24px/1.3 Georgia,serif;color:#fff}.gate p{color:var(--muted);max-width:320px;margin:0}
  .gate .gi{display:flex;gap:8px;width:280px;max-width:86vw}.gate input{text-align:center}
  .gate .err{color:#ff8a8a;font:600 12px/1 Arial,sans-serif;min-height:12px}
  #book{position:fixed;inset:0;z-index:20;background:radial-gradient(1200px 800px at 50% 30%,#120a24,#07040d 70%);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .26s cubic-bezier(.3,.7,.3,1)}
  #book.open{transform:none}
  .bkhead{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .bkhead .bg{font-size:24px}
  .bkhead b{font:700 20px/1 Georgia,serif;color:#fff}
  .bkhead small{display:block;font:700 10px/1 Arial;letter-spacing:2px;text-transform:uppercase;color:#818cf8;margin-top:4px}
  .bkbody{flex:1;overflow:auto;padding:14px 16px 60px;max-width:760px;width:100%;margin:0 auto}
  .sec{border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden;background:#0b0816}
  .sechd{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer}
  .sechd .cv{color:#818cf8;font-size:13px;transition:transform .18s}
  .sec.open .sechd .cv{transform:rotate(90deg)}
  .sechd .nm{flex:1;font:700 16px/1.2 Georgia,serif;color:#eef0f7}
  .sechd .ct{font:700 11px/1 Arial;color:var(--muted)}
  .secbody{display:none;padding:0 16px 14px}
  .sec.open .secbody{display:block}
  .ent{border-top:1px solid var(--line);padding:12px 0}
  .enthd{display:flex;align-items:center;gap:8px;cursor:pointer}
  .enthd .et{flex:1;font:700 15px/1.3 Arial;color:#cfd3e6}
  .enthd .cv{color:#6a6786;font-size:12px;transition:transform .18s}
  .ent.open .enthd .cv{transform:rotate(90deg)}
  .entbody{display:none;margin-top:10px}
  .ent.open .entbody{display:block}
  .entbody .desc{color:#cdd0e0;font:400 15px/1.7 Georgia,serif;white-space:pre-wrap}
  .minirow{display:flex;gap:8px;margin-top:12px}
  .addrow{margin-top:6px}
  .ghost{background:transparent;border:1px dashed var(--line);color:var(--muted);font:600 13px/1 Arial;padding:10px 14px;border-radius:11px;cursor:pointer;width:100%}
  .ghost:hover{border-color:var(--accent);color:var(--accent)}
  .hide{display:none!important}
</style>
</head>
<body>
<svg id="sky">
  <defs>
    <filter id="soft" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <g id="world">
    <g id="lobes"></g>
    <g id="links"></g>
    <g id="pulses"></g>
    <g id="rlabels"></g>
    <g id="nodes"></g>
  </g>
</svg>

<div id="bar">
  <div class="brandrow"><span class="dotmk"></span><div><b>The Brain</b><br><span>your command center</span></div></div>
  <div class="sp"></div>
  <a class="btn" href="/scan" title="I.O. Decipher: scan handwritten notes into the Brain" style="text-decoration:none">📝 Notes</a>
  <button class="btn" id="bookBtn" title="Your playbook">📖 Playbook</button>
  <button class="btn" id="nextBtn" title="Where to go from here">🧭 What's next</button>
  <button class="btn" id="connectBtn" title="Wire two nodes together">🔗 Connect</button>
  <button class="btn neon" id="addBtn">＋ Add</button>
</div>

<div id="legend"></div>
<div class="hint" id="hint">Drag to move · scroll to zoom · tap a node to open it</div>
<div id="panel"><div id="panelInner"></div></div>
<div class="toast" id="toast"></div>

<div id="book">
  <div class="bkhead"><span class="bg">📖</span><div style="flex:1"><b>The Playbook</b><small>how I think and how I sell</small></div><span class="x" id="bookClose">✕</span></div>
  <div class="bkbody" id="bkBody"></div>
</div>

<div class="gate hide" id="gate">
  <span class="dotmk"></span>
  <b>The Brain</b>
  <p>Your private space. Enter your passcode.</p>
  <div class="gi"><input id="gpass" type="password" placeholder="Passcode" autocomplete="current-password"><button class="btn neon" id="ggo">Enter</button></div>
  <div class="err" id="gerr"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const SVG="http://www.w3.org/2000/svg";
const REGIONS={
  core:{label:"",color:"#ffffff",glyph:"",angle:0},
  apps:{label:"APPS",color:"#2dd4bf",glyph:"📱",angle:-90},
  knowledge:{label:"KNOWLEDGE",color:"#818cf8",glyph:"📚",angle:-18},
  content:{label:"CONTENT",color:"#fb7185",glyph:"🎬",angle:54},
  growth:{label:"GROWTH",color:"#4ade80",glyph:"📈",angle:126},
  ideas:{label:"IDEAS",color:"#fb923c",glyph:"💡",angle:198},
};
const ANCHOR_R=320;
const STATUS_LABELS={live:"Live",building:"Building",idea:"Idea",paused:"Paused"};
let N=[],L=[],byId={},PB=[];
let view={s:1,tx:0,ty:0};
let connectMode=false,connectFirst=null;
const sky=$("#sky"),world=$("#world"),gLobes=$("#lobes"),gLinks=$("#links"),gNodes=$("#nodes"),gPulses=$("#pulses"),gR=$("#rlabels");

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1800);}
async function api(path,opts){return fetch(path,Object.assign({headers:{"content-type":"application/json"}},opts));}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function col(n){return (REGIONS[n.region]||REGIONS.ideas).color;}

(function legend(){ $("#legend").innerHTML=Object.entries(REGIONS).filter(([k])=>k!=="core").map(([k,r])=>`<div class="lg"><i style="color:${r.color};background:${r.color}"></i> ${r.label[0]+r.label.slice(1).toLowerCase()}</div>`).join(""); })();

async function boot(){
  let r; try{ r=await api("/api/brain"); }catch(e){ return showGate("Can't reach the server."); }
  if(r.status===401){ return showGate(); }
  const data=await r.json(); $("#gate").classList.add("hide");
  N=data.nodes||[]; L=data.links||[]; PB=data.playbook||[];
  N.forEach(n=>{ n.vx=0;n.vy=0; if(!n.x&&!n.y&&n.region!=="core"){ const a=(REGIONS[n.region]||{}).angle||0, rad=a*Math.PI/180; n.x=Math.cos(rad)*220+(Math.random()-.5)*140;n.y=Math.sin(rad)*220+(Math.random()-.5)*140; } });
  index(); build(); requestAnimationFrame(tick);
}
function showGate(msg){ $("#gate").classList.remove("hide"); if(msg)$("#gerr").textContent=msg; setTimeout(()=>$("#gpass")&&$("#gpass").focus(),50); }
$("#ggo").onclick=submitGate;
$("#gpass")&&($("#gpass").onkeydown=e=>{ if(e.key==="Enter")submitGate(); });
async function submitGate(){ $("#gerr").textContent=""; const pass=$("#gpass").value;
  const r=await api("/api/brain/login",{method:"POST",body:JSON.stringify({passcode:pass})});
  if(r.ok){ $("#gpass").value=""; boot(); } else { $("#gerr").textContent="Wrong passcode."; }
}
function index(){ byId={}; N.forEach(n=>byId[n.id]=n); }

/* ---------- build ---------- */
function build(){
  gLobes.innerHTML="";gLinks.innerHTML="";gNodes.innerHTML="";gPulses.innerHTML="";gR.innerHTML="";
  Object.keys(REGIONS).filter(k=>k!=="core").forEach(k=>{
    const blob=document.createElementNS(SVG,"ellipse"); blob.setAttribute("fill",REGIONS[k].color); blob.setAttribute("opacity",".16"); blob.setAttribute("filter","url(#soft)");
    blob.dataset.region=k; gLobes.appendChild(blob); REGIONS[k]._blob=blob;
    const lab=document.createElementNS(SVG,"text"); lab.setAttribute("class","rlabel"); lab.setAttribute("text-anchor","middle"); lab.setAttribute("fill",REGIONS[k].color); lab.textContent=REGIONS[k].label;
    gR.appendChild(lab); REGIONS[k]._lab=lab;
  });
  L.forEach(l=>{
    const other=byId[l.a]&&byId[l.a].region==="core"?byId[l.b]:byId[l.a];
    const c=other?col(other):"#5a5a7a";
    const p=document.createElementNS(SVG,"path"); p.setAttribute("fill","none"); p.setAttribute("stroke",c); p.setAttribute("stroke-width","1.5"); p.setAttribute("stroke-opacity",".55"); p.setAttribute("filter","url(#glow)");
    gLinks.appendChild(p); l._el=p;
    const pulse=document.createElementNS(SVG,"circle"); pulse.setAttribute("r","2.4"); pulse.setAttribute("fill",c); gPulses.appendChild(pulse); l._p=pulse; l._t=Math.random();
  });
  N.forEach(n=>{
    const r=REGIONS[n.region]||REGIONS.ideas, isCore=n.region==="core", R=isCore?42:22, c=isCore?"#ffffff":r.color;
    const g=document.createElementNS(SVG,"g"); g.setAttribute("class","ndot"); g.dataset.id=n.id;
    const halo=document.createElementNS(SVG,"circle"); halo.setAttribute("r",R+(isCore?16:9)); halo.setAttribute("fill",c); halo.setAttribute("opacity",isCore?.4:(n.status==="idea"?.14:.32)); halo.setAttribute("filter","url(#glow)");
    const core=document.createElementNS(SVG,"circle"); core.setAttribute("r",R); core.setAttribute("fill",isCore?"#f3f4ff":"#0c0a16"); core.setAttribute("stroke",c); core.setAttribute("stroke-width",isCore?0:2.4);
    if(n.status==="idea"){core.setAttribute("stroke-dasharray","4 4");core.setAttribute("stroke-opacity",".75");}
    if(n.status==="paused"){core.setAttribute("stroke","#6a6480");}
    const glyph=document.createElementNS(SVG,"text"); glyph.setAttribute("class","glyph"); glyph.setAttribute("y",isCore?"2":"1");
    glyph.textContent=isCore?"":r.glyph; if(isCore){glyph.setAttribute("fill","#120f1e");glyph.setAttribute("font","800 15px Arial");glyph.textContent="YOU";}
    const label=document.createElementNS(SVG,"text"); label.setAttribute("class","label"); label.setAttribute("text-anchor","middle"); label.setAttribute("y",R+16); label.setAttribute("font-size",isCore?"14":"12"); label.textContent=n.title;
    g.append(halo,core,glyph,label); gNodes.appendChild(g); n._el=g; n._core=core;
    g.addEventListener("pointerdown",e=>onNodeDown(e,n));
  });
}

/* ---------- physics ---------- */
function tick(){
  const REP=16000,SPR=.012,LEN=140,ANCH=.012,DAMP=.86;
  for(let i=0;i<N.length;i++){ const a=N[i]; if(a.region==="core"){a.x=0;a.y=0;a.vx=a.vy=0;continue;}
    for(let j=i+1;j<N.length;j++){ const b=N[j]; let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy;
      if(d2<4){ dx=Math.random()-.5; dy=Math.random()-.5; d2=dx*dx+dy*dy; }
      const d=Math.sqrt(d2),f=REP/d2,fx=dx/d*f,fy=dy/d*f;
      a.vx+=fx;a.vy+=fy; if(b.region!=="core"){b.vx-=fx;b.vy-=fy;} }
    const ang=((REGIONS[a.region]||{}).angle||0)*Math.PI/180, ax=Math.cos(ang)*ANCHOR_R, ay=Math.sin(ang)*ANCHOR_R;
    a.vx+=(ax-a.x)*ANCH; a.vy+=(ay-a.y)*ANCH;
  }
  L.forEach(l=>{ const a=byId[l.a],b=byId[l.b]; if(!a||!b)return; let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01,f=(d-LEN)*SPR,fx=dx/d*f,fy=dy/d*f;
    if(a.region!=="core"){a.vx+=fx;a.vy+=fy;} if(b.region!=="core"){b.vx-=fx;b.vy-=fy;} });
  N.forEach(n=>{ if(n===dragging||n.region==="core")return; n.vx*=DAMP;n.vy*=DAMP; n.vx=Math.max(-6,Math.min(6,n.vx));n.vy=Math.max(-6,Math.min(6,n.vy)); n.x+=n.vx;n.y+=n.vy; });
  world.setAttribute("transform",`translate(${innerWidth/2+view.tx},${innerHeight/2+view.ty}) scale(${view.s})`);
  N.forEach(n=>n._el.setAttribute("transform",`translate(${n.x},${n.y})`));
  // region lobes follow their nodes' centroid
  Object.keys(REGIONS).filter(k=>k!=="core").forEach(k=>{
    const ns=N.filter(n=>n.region===k); const blob=REGIONS[k]._blob,lab=REGIONS[k]._lab; if(!blob)return;
    if(!ns.length){ const ang=REGIONS[k].angle*Math.PI/180; const ax=Math.cos(ang)*ANCHOR_R,ay=Math.sin(ang)*ANCHOR_R;
      blob.setAttribute("opacity",".05"); blob.setAttribute("cx",ax);blob.setAttribute("cy",ay);blob.setAttribute("rx",120);blob.setAttribute("ry",110);
      lab.setAttribute("x",ax);lab.setAttribute("y",ay);lab.setAttribute("opacity",".4"); return; }
    let cx=0,cy=0,minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9; ns.forEach(n=>{cx+=n.x;cy+=n.y;minx=Math.min(minx,n.x);miny=Math.min(miny,n.y);maxx=Math.max(maxx,n.x);maxy=Math.max(maxy,n.y);}); cx/=ns.length;cy/=ns.length;
    blob.setAttribute("cx",cx);blob.setAttribute("cy",cy);blob.setAttribute("rx",Math.max(130,(maxx-minx)/2+120));blob.setAttribute("ry",Math.max(120,(maxy-miny)/2+110));blob.setAttribute("opacity",".17");
    lab.setAttribute("x",cx);lab.setAttribute("y",miny-54);lab.setAttribute("opacity",".9");
  });
  L.forEach(l=>{ const a=byId[l.a],b=byId[l.b]; if(!a||!b)return;
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y,nx=-dy,ny=dx,k=.1,cx=mx+nx*k,cy=my+ny*k;
    l._el.setAttribute("d",`M${a.x},${a.y} Q${cx},${cy} ${b.x},${b.y}`);
    l._t=(l._t+.004)%1; const tt=l._t,u=1-tt; l._p.setAttribute("cx",u*u*a.x+2*u*tt*cx+tt*tt*b.x); l._p.setAttribute("cy",u*u*a.y+2*u*tt*cy+tt*tt*b.y);
  });
  requestAnimationFrame(tick);
}

/* ---------- pan/zoom ---------- */
let panning=false,panStart=null;
sky.addEventListener("pointerdown",e=>{ if(e.target.closest(".ndot"))return; panning=true;panStart={x:e.clientX-view.tx,y:e.clientY-view.ty};sky.classList.add("grabbing"); if(connectMode)setConnect(false); });
addEventListener("pointermove",e=>{ if(panning){view.tx=e.clientX-panStart.x;view.ty=e.clientY-panStart.y;} if(dragging)onDragMove(e); });
addEventListener("pointerup",()=>{ panning=false;sky.classList.remove("grabbing"); if(dragging)onDragUp(); });
sky.addEventListener("wheel",e=>{ e.preventDefault(); const f=e.deltaY<0?1.1:1/1.1; view.s=Math.max(.3,Math.min(2.6,view.s*f)); },{passive:false});

/* ---------- node drag/click ---------- */
let dragging=null,dragMoved=false,dragStart=null,layoutTimer=null;
function toWorld(cx,cy){ return {x:(cx-innerWidth/2-view.tx)/view.s,y:(cy-innerHeight/2-view.ty)/view.s}; }
function onNodeDown(e,n){ e.stopPropagation(); if(connectMode){ pickConnect(n); return; } if(n.region==="core"){ openNode(n); return; }
  dragging=n;dragMoved=false;dragStart={x:e.clientX,y:e.clientY}; }
function onDragMove(e){ if(!dragging)return; const w=toWorld(e.clientX,e.clientY); dragging.x=w.x;dragging.y=w.y;dragging.vx=dragging.vy=0; if(Math.hypot(e.clientX-dragStart.x,e.clientY-dragStart.y)>4)dragMoved=true; }
function onDragUp(){ const n=dragging;dragging=null; if(!dragMoved){openNode(n);return;} n.pinned=true;saveLayout(); }
function saveLayout(){ clearTimeout(layoutTimer); layoutTimer=setTimeout(()=>{ api("/api/brain/layout",{method:"POST",body:JSON.stringify({positions:N.map(n=>({id:n.id,x:Math.round(n.x),y:Math.round(n.y),pinned:!!n.pinned}))})}); },600); }

/* ---------- connect ---------- */
$("#connectBtn").onclick=()=>setConnect(!connectMode);
function setConnect(on){ connectMode=on;connectFirst=null; $("#connectBtn").classList.toggle("on",on);
  $("#hint").textContent=on?"Connect mode: tap one node, then another. Tap the background to stop.":"Drag to move · scroll to zoom · tap a node to open it"; }
function pickConnect(n){ if(!connectFirst){ connectFirst=n; n._core.setAttribute("stroke","#7cf5ff"); toast("Now tap the node to connect to "+n.title); return; }
  if(connectFirst.id===n.id)return;
  api("/api/brain/link",{method:"POST",body:JSON.stringify({a:connectFirst.id,b:n.id})}).then(()=>{ L.push({a:connectFirst.id,b:n.id}); build(); toast("Wired."); setConnect(false); }); }

/* ---------- panel ---------- */
let selected=null;
function openNode(n){ if(n.id==="academy"){ renderBook(); $("#book").classList.add("open"); return; } selected=n; const r=REGIONS[n.region]||REGIONS.ideas, isCore=n.region==="core";
  $("#panelInner").innerHTML=`
    <div class="ph"><span class="pg">${isCore?"🧠":r.glyph}</span><div class="pt"><b>${esc(n.title)}</b><small style="color:${isCore?'#fff':r.color}">${isCore?"The center":r.label+" · <span class='status-"+n.status+"'>"+(STATUS_LABELS[n.status]||n.status)+"</span>"}</small></div><span class="x" id="pClose">✕</span></div>
    <div class="pb">
      ${n.desc?`<div class="desc">${esc(n.desc)}</div>`:'<div class="desc" style="color:#6a6786">No description yet.</div>'}
      ${n.next?`<div style="margin-top:14px;padding:12px 14px;border:1px solid #1e3a44;border-radius:12px;background:rgba(124,245,255,.06)"><div style="color:#7cf5ff;font:700 10px/1 Arial;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px">Next step</div><div class="desc" style="font-size:14px;margin:0">${esc(n.next)}</div></div>`:""}
      ${n.url?`<label>Link</label><a class="linkout" href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.url)} ↗</a>`:""}
      ${n.notes?`<label>Notes</label><div class="desc" style="font-size:13px">${esc(n.notes)}</div>`:""}
      <div class="view-actions">
        <span class="chip" id="pEdit">✏️ Edit</span>
        <span class="chip" id="pConnect">🔗 Connect</span>
        ${!isCore?'<span class="chip" id="pDelete">🗑 Remove</span>':""}
      </div>
    </div>`;
  $("#panel").classList.add("open"); $("#pClose").onclick=closePanel; $("#pEdit").onclick=()=>formPanel(n);
  $("#pConnect").onclick=()=>{ closePanel(); setConnect(true); pickConnect(n); };
  const d=$("#pDelete"); if(d)d.onclick=()=>removeNode(n);
}
function closePanel(){ $("#panel").classList.remove("open"); selected=null; }
$("#addBtn").onclick=()=>formPanel(null);

/* ---------- What's next: reads the brain and tells you where to go ---------- */
function nextMoves(){
  const m=[]; const nodes=N.filter(n=>n.region!=="core");
  nodes.filter(n=>n.status==="building").forEach(n=>{ if(n.next)m.push({n,pri:1,t:"Keep going on "+n.title,s:n.next}); else m.push({n,pri:2,t:"Set the next step for "+n.title,s:"It's in motion but has no next move written down."}); });
  nodes.filter(n=>n.status==="idea").forEach(n=>m.push({n,pri:3,t:"Start "+n.title,s:n.next||n.desc||"Turn this from an idea into something you're building."}));
  Object.keys(REGIONS).filter(k=>k!=="core").forEach(k=>{ if(!N.some(n=>n.region===k))m.push({region:k,pri:4,t:"Add your first "+REGIONS[k].label.toLowerCase()+" node",s:"This lobe is empty."}); });
  nodes.filter(n=>!n.desc).forEach(n=>m.push({n,pri:5,t:"Describe "+n.title,s:"No description yet, write one line on what it is."}));
  m.sort((a,b)=>a.pri-b.pri);
  return m;
}
$("#nextBtn").onclick=openNext;
function openNext(){
  const m=nextMoves();
  const focus=m[0];
  const rows=m.slice(0,12).map((x,i)=>{ const c=x.n?col(x.n):(REGIONS[x.region]||{}).color||"#7cf5ff";
    return `<div class="mv" data-i="${i}" style="display:flex;gap:11px;align-items:flex-start;padding:12px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;cursor:pointer;background:#0b0814">
      <span style="width:9px;height:9px;border-radius:50%;background:${c};box-shadow:0 0 8px ${c};margin-top:4px;flex:none"></span>
      <div style="min-width:0"><div style="font:700 14px/1.3 Arial;color:#eef0f7">${esc(x.t)}</div><div style="font:400 13px/1.45 Arial;color:#9aa0b5;margin-top:2px">${esc(x.s)}</div></div></div>`; }).join("");
  $("#panelInner").innerHTML=`
    <div class="ph"><span class="pg">🧭</span><div class="pt"><b>What's next</b><small style="color:var(--accent)">where to go from here</small></div><span class="x" id="pClose">✕</span></div>
    <div class="pb">
      ${focus?`<div style="padding:14px 16px;border:1px solid #1e3a44;border-radius:14px;background:linear-gradient(180deg,rgba(124,245,255,.1),rgba(124,245,255,.03));margin-bottom:16px">
        <div style="color:#7cf5ff;font:800 10px/1 Arial;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px">Do this now</div>
        <div style="font:700 16px/1.35 Georgia,serif;color:#fff">${esc(focus.t)}</div>
        <div style="color:#b9bdd0;font:400 13px/1.5 Arial;margin-top:5px">${esc(focus.s)}</div>
      </div>`:'<div class="desc" style="color:#6a6786">You are all caught up. Add something new or set a next step on a node.</div>'}
      ${m.length>1?'<label>Then</label>':""}
      ${rows}
    </div>`;
  $("#panel").classList.add("open"); $("#pClose").onclick=closePanel;
  $("#panelInner").querySelectorAll(".mv").forEach(el=>el.onclick=()=>{ const x=m[+el.dataset.i]; if(x.n)openNode(x.n); else formPanel(null); });
}

function formPanel(n){ const isNew=!n, isCore=n&&n.region==="core";
  $("#panelInner").innerHTML=`
    <div class="ph"><span class="pg">${isNew?"✨":"✏️"}</span><div class="pt"><b>${isNew?"Add to the brain":"Edit"}</b><small style="color:var(--accent)">${isNew?"a product, app, idea or anything":"update this node"}</small></div><span class="x" id="pClose">✕</span></div>
    <div class="pb">
      <label>Name</label><input id="fTitle" maxlength="80" value="${n?esc(n.title):""}" placeholder="e.g. Lead CRM">
      ${isCore?"":`<div class="row2">
        <div><label>Region</label><select id="fRegion">${Object.keys(REGIONS).filter(k=>k!=="core").map(k=>`<option value="${k}" ${n&&n.region===k?"selected":""}>${REGIONS[k].label[0]+REGIONS[k].label.slice(1).toLowerCase()}</option>`).join("")}</select></div>
        <div><label>Status</label><select id="fStatus">${Object.keys(STATUS_LABELS).map(k=>`<option value="${k}" ${n&&n.status===k?"selected":(!n&&k==="idea"?"selected":"")}>${STATUS_LABELS[k]}</option>`).join("")}</select></div>
      </div>`}
      <label>What is it</label><textarea id="fDesc" maxlength="2000" placeholder="One or two lines.">${n?esc(n.desc||""):""}</textarea>
      ${isCore?"":`<label>Next step <span style="color:#7cf5ff;font-weight:600;text-transform:none;letter-spacing:0">(what moves this forward)</span></label><input id="fNext" maxlength="300" value="${n?esc(n.next||""):""}" placeholder="e.g. point the domain, write 5 playbooks">`}
      <label>Link (optional)</label><input id="fUrl" maxlength="400" value="${n?esc(n.url||""):""}" placeholder="https://...">
      <label>Notes (optional)</label><textarea id="fNotes" maxlength="4000" placeholder="Anything to remember.">${n?esc(n.notes||""):""}</textarea>
    </div>
    <div class="pf"><button class="btn" id="pCancel">Cancel</button><button class="btn neon" id="pSave">${isNew?"Add it":"Save"}</button></div>`;
  $("#panel").classList.add("open"); $("#pClose").onclick=closePanel; $("#pCancel").onclick=()=>n?openNode(n):closePanel();
  $("#pSave").onclick=async()=>{
    const payload={ id:n?n.id:undefined, title:$("#fTitle").value.trim()||"Untitled", desc:$("#fDesc").value.trim(), url:$("#fUrl").value.trim(), notes:$("#fNotes").value.trim() };
    if(!isCore){ payload.region=$("#fRegion").value; payload.status=$("#fStatus").value; payload.next=($("#fNext")||{}).value?$("#fNext").value.trim():""; }
    if(isNew){ const ang=(REGIONS[payload.region]||{}).angle*Math.PI/180; payload.x=Math.cos(ang)*ANCHOR_R+(Math.random()-.5)*60; payload.y=Math.sin(ang)*ANCHOR_R+(Math.random()-.5)*60; }
    const r=await(await api("/api/brain/node",{method:"POST",body:JSON.stringify(payload)})).json();
    if(!r.ok){ toast(r.error||"Could not save"); return; }
    if(isNew){ const node=r.node;node.vx=0;node.vy=0;N.push(node);L.push({a:"core",b:node.id});index();build();openNode(node);toast("Added to the brain."); }
    else { Object.assign(n,r.node);index();build();openNode(n);toast("Saved."); }
  };
}
async function removeNode(n){ if(!confirm("Remove “"+n.title+"” from the brain?"))return;
  const r=await(await api("/api/brain/node/delete",{method:"POST",body:JSON.stringify({id:n.id})})).json();
  if(!r.ok){ toast(r.error||"Could not remove"); return; }
  N=N.filter(x=>x.id!==n.id); L=L.filter(l=>l.a!==n.id&&l.b!==n.id); index(); build(); closePanel(); toast("Removed.");
}
/* ---------- The Playbook ---------- */
$("#bookBtn").onclick=()=>{ renderBook(); $("#book").classList.add("open"); };
$("#bookClose").onclick=()=>$("#book").classList.remove("open");
function renderBook(){
  const wrap=$("#bkBody");
  if(!PB.length){ wrap.innerHTML=`<div class="desc" style="color:#6a6786;padding:18px 4px">Your playbook is empty. Add your first section below.</div>`; }
  else {
    wrap.innerHTML=PB.map((s,si)=>`
      <div class="sec ${s._open?'open':''}" data-si="${si}">
        <div class="sechd"><span class="cv">▶</span><span class="nm">${esc(s.name)}</span><span class="ct">${s.entries.length}</span>
          <span class="x secren" title="Rename" style="font-size:15px">✏️</span><span class="x secdel" title="Delete section" style="font-size:15px">🗑</span></div>
        <div class="secbody">
          ${s.entries.map((e,ei)=>`
            <div class="ent ${e._open?'open':''}" data-ei="${ei}">
              <div class="enthd"><span class="cv">▶</span><span class="et">${esc(e.title)}</span></div>
              <div class="entbody">
                <div class="desc">${e.body?esc(e.body):'<span style="color:#6a6786">Empty.</span>'}</div>
                <div class="minirow"><span class="chip entedit">✏️ Edit</span><span class="chip entdel">🗑 Remove</span></div>
              </div>
            </div>`).join("")}
          <div class="addrow"><button class="ghost entadd">＋ Add entry</button></div>
        </div>
      </div>`).join("");
  }
  wrap.innerHTML+=`<div class="addrow" style="margin-top:4px"><button class="ghost secadd">＋ Add section</button></div>`;
  wireBook();
}
function wireBook(){
  const wrap=$("#bkBody");
  wrap.querySelectorAll(".sec").forEach(secEl=>{
    const si=+secEl.dataset.si, s=PB[si];
    secEl.querySelector(".sechd").onclick=(ev)=>{ if(ev.target.closest(".secren")||ev.target.closest(".secdel"))return; s._open=!s._open; renderBook(); };
    secEl.querySelector(".secren").onclick=()=>{ const nm=prompt("Section name",s.name); if(nm==null)return; s.name=nm.trim()||s.name; savePB(); renderBook(); };
    secEl.querySelector(".secdel").onclick=()=>{ if(!confirm("Delete “"+s.name+"” and everything in it?"))return; PB.splice(si,1); savePB(); renderBook(); };
    secEl.querySelector(".entadd").onclick=()=>{ const t=prompt("Entry title"); if(t==null)return; s.entries.push({id:"",title:(t.trim()||"Untitled"),body:"",_open:true}); s._open=true; savePB(); renderBook(); };
    secEl.querySelectorAll(".ent").forEach(entEl=>{
      const ei=+entEl.dataset.ei, e=s.entries[ei];
      entEl.querySelector(".enthd").onclick=()=>{ e._open=!e._open; renderBook(); };
      const edit=entEl.querySelector(".entedit"); if(edit)edit.onclick=()=>editEntry(si,ei);
      const del=entEl.querySelector(".entdel"); if(del)del.onclick=()=>{ if(!confirm("Remove “"+e.title+"”?"))return; s.entries.splice(ei,1); savePB(); renderBook(); };
    });
  });
  wrap.querySelector(".secadd").onclick=()=>{ const nm=prompt("Section name (e.g. Philosophy)"); if(nm==null)return; PB.push({id:"",name:(nm.trim()||"Untitled"),entries:[],_open:true}); savePB(); renderBook(); };
}
function editEntry(si,ei){
  const s=PB[si], e=s.entries[ei];
  const entEl=$(`#bkBody .sec[data-si="${si}"] .ent[data-ei="${ei}"]`);
  const body=entEl.querySelector(".entbody");
  body.innerHTML=`<label>Title</label><input class="eT" maxlength="120" value="${esc(e.title)}">
    <label>Body</label><textarea class="eB" style="min-height:240px">${esc(e.body)}</textarea>
    <div class="minirow"><button class="btn" data-a="cancel">Cancel</button><button class="btn neon" data-a="save" style="flex:1">Save</button></div>`;
  body.querySelector('[data-a="cancel"]').onclick=()=>renderBook();
  body.querySelector('[data-a="save"]').onclick=()=>{ e.title=body.querySelector(".eT").value.trim()||"Untitled"; e.body=body.querySelector(".eB").value; savePB(); renderBook(); };
}
async function savePB(){
  const clean=PB.map(s=>({id:s.id||"",name:s.name,entries:s.entries.map(e=>({id:e.id||"",title:e.title,body:e.body}))}));
  let r; try{ r=await(await api("/api/brain/playbook",{method:"POST",body:JSON.stringify({sections:clean})})).json(); }catch(_){ toast("Could not save"); return; }
  if(r&&r.ok&&Array.isArray(r.playbook)){
    r.playbook.forEach((ss,i)=>{ if(PB[i]){ PB[i].id=ss.id; ss.entries.forEach((ee,j)=>{ if(PB[i].entries[j])PB[i].entries[j].id=ee.id; }); } });
    toast("Saved.");
  } else toast((r&&r.error)||"Could not save");
}
boot();
</script>
</body>
</html>
